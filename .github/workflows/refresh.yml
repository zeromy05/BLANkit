name: BLANkit Crawler Refresh

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: '실행 모드 (refresh=갱신, full=전체크롤링, clear=DB초기화+전체크롤링)'
        required: false
        default: 'refresh'
        type: choice
        options:
          - refresh
          - full
          - clear

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Restore crawl state
        uses: actions/cache@v4
        with:
          path: |
            crawled_urls.txt
            crawled_programs.jsonl
            preview_map.jsonl
          key: crawl-state-${{ github.run_id }}
          restore-keys: |
            crawl-state-

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run crawler
        env:
          BISKIT_ID: ${{ secrets.BISKIT_ID }}
          BISKIT_PW: ${{ secrets.BISKIT_PW }}
          BISKIT_LIST_URL: ${{ secrets.BISKIT_LIST_URL }}
          MAX_PAGES: '15'
          DEBUG_ONLY: '0'
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASS: ${{ secrets.DB_PASS }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_SSL: '1'
        run: |
          MODE="${{ github.event.inputs.mode }}"
          if [ "$MODE" = "clear" ]; then
            python -c "
import pymysql, os
conn = pymysql.connect(
    host=os.environ['DB_HOST'], port=int(os.environ['DB_PORT']),
    user=os.environ['DB_USER'], password=os.environ['DB_PASS'],
    database=os.environ['DB_NAME'], charset='utf8mb4', ssl={}
)
with conn.cursor() as cur:
    cur.execute('DELETE FROM program')
    print(f'DB 초기화: {cur.rowcount}개 삭제')
conn.commit(); conn.close()
"
            python biskit_crawler.py --auto
          elif [ "$MODE" = "full" ]; then
            python biskit_crawler.py --auto
          else
            python biskit_crawler.py --refresh --auto
          fi
