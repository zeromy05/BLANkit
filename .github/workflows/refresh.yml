name: BLANkit Crawler Refresh

on:
  schedule:
    - cron: '0 0,8,16 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: '실행 모드 (refresh=갱신, full=전체크롤링)'
        required: false
        default: 'refresh'
        type: choice
        options:
          - refresh
          - full

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore session cookies
        uses: actions/cache/restore@v4
        with:
          path: biskit_cookies.json
          key: biskit-session-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            biskit-session-${{ runner.os }}-

      - name: Run crawler
        env:
          BISKIT_ID: ${{ secrets.BISKIT_ID }}
          BISKIT_PW: ${{ secrets.BISKIT_PW }}
          BISKIT_LIST_URL: ${{ secrets.BISKIT_LIST_URL }}
          BISKIT_2FA_WAIT: '180'
          MAX_PAGES: '15'
          DEBUG_ONLY: '0'
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASS: ${{ secrets.DB_PASS }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_SSL: '1'
        run: |
          if [ "${{ github.event.inputs.mode }}" = "full" ]; then
            python biskit_crawler.py --auto
          else
            python biskit_crawler.py --refresh --auto
          fi

      - name: Save session cookies
        if: always()
        uses: actions/cache/save@v4
        with:
          path: biskit_cookies.json
          key: biskit-session-${{ runner.os }}-${{ github.run_id }}
